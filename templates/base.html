<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
        {% block head %}{% endblock %}
    </head>
    
    <body class="bg-secondary font-mono text-secondary flex flex-col min-h-screen">
        <div class="relative">
            <nav class="relative flex justify-center z-10 bg-primary border-primary" style="margin-bottom: 5px; justify-content: start;">
                <div class="flex flex-1 justify-center" style="padding-top: 10px; padding-bottom: 10px;">
                    <div class="hidden sm:ml-6 sm:block">
                        <div class="flex space-x-4">
                            <h1 class=" text-3xl font-bold">Osu Gene</h1>
                            <img src="{{ url_for('static', filename='images/osu_logo.png') }}">
                        </div>
                    </div>
            </nav>
            <div class="absolute inset-0 bg-primary blur-xs"></div>
        </div>
        <main class="grow">
        {% block body %}{% endblock %}
        </main>
        <footer>
            <div class="relative">
            <nav class="relative z-10 bg-primary after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10">
                <div class="flex flex-1 justify-start sm:items-stretch sm:justify-start">
                    <div class="hidden sm:ml-6 sm:block">
                        <div class="flex space-x-4">
                            <!-- logo -->
                        </div>
                    </div>
                <div class="flex flex-1 justify-end sm:items-stretch sm:justify-end" style=" padding-top: 10px; padding-bottom: 10px;">
                    <div class="hidden sm:ml-6 sm:block">
                        <div class="flex space-x-4" style="margin-right: 10px;">
                        </div>
                    </div>
                </div>
            </nav>
            <div class="absolute inset-0 bg-primary blur-sm"></div>
        </footer>
    </body>
</html>
