<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
        {% block head %}{% endblock %}
    </head>
    
    <body class="bg-secondary font-sans">
        <nav class="relative bg-primary after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10" style="margin-bottom: 5px; justify-content: start;">
            <div class="flex flex-1 justify-start sm:items-stretch sm:justify-start" style="padding-top: 10px; padding-bottom: 10px;">
                <div class="hidden sm:ml-6 sm:block">
                    <div class="flex space-x-4">
                        
                    </div>
                </div>
            <div class="flex flex-1 justify-end sm:items-stretch sm:justify-end" style=" padding-top: 10px; padding-bottom: 10px;">
                <div class="hidden sm:ml-6 sm:block">
                    <div class="flex space-x-4" style="margin-right: 10px;">
                        <img class="size-8"src="{{ url_for('static', filename='images/me.png') }}">
                    </div>
                </div>
            </div>
        </nav>

        {% block body %}{% endblock %}
        <footer class="footContainer">
            <div>
            </div>
        </footer>
    </body>
</html>
